name: "Copilot Setup Steps"

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Ensure bash is available at /usr/bin/bash
              run: |
                  if [ ! -f /usr/bin/bash ]; then
                    sudo ln -sf /bin/bash /usr/bin/bash
                  fi
