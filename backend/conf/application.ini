[product]
; ─── 框架核心 ────────────────────────────────────────────────────────
application.directory    = APP_PATH "/application"
application.library      = APP_PATH "/application/library"
application.dispatcher.catchException = TRUE
application.dispatcher.throwException = FALSE

; ─── 数据库（修改为实际配置） ─────────────────────────────────────────
database.host     = "127.0.0.1"
database.port     = "3306"
database.dbname   = "learn_community"
database.username = "root"
database.password = ""
database.charset  = "utf8mb4"

; ─── JWT ────────────────────────────────────────────────────────────
; ⚠️  上线前务必修改 jwt.secret 为随机强密钥
jwt.secret = "lc_@Secret#2024_CHANGE_BEFORE_DEPLOY"
jwt.expire = 86400

; ─── 应用 ───────────────────────────────────────────────────────────
app.name    = "LearnCommunity API"
app.version = "1.0.0"
